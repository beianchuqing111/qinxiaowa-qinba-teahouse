@media(max-width:760px){.login{background-size:auto 100%;background-position:35% center}.login-hotspots{position:static;transform:none;width:auto;height:auto;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:28px 18px;background:linear-gradient(180deg,transparent 20%,#f8f8f0f0 55%)}.login-hotspots:before{content:'管理员登录';color:var(--green);font-size:25px;font-weight:700}.login-hotspots input,.login-hotspots .login-submit,.login-hotspots .login-error{position:static;width:100%;height:auto}.login-hotspots input{padding:14px;border:1px solid #b9cfc2;background:#fff;border-radius:6px}.login-hotspots input::placeholder{color:#8a9a92}.login-hotspots .login-submit{background:var(--green);color:#fff;padding:15px;border-radius:6px;font-weight:700}.login-hotspots .eye{position:absolute;left:auto;right:27px;top:auto;bottom:163px;color:var(--green)}.login-hotspots .login-error{background:transparent}.topbar{height:auto;min-height:74px;padding:14px 18px;gap:8px}.brand-mini strong{font-size:21px}.brand-mini span{font-size:12px}.userbar{display:none}.content{padding:25px 12px 40px}.heading{display:block}.heading-actions{margin-top:17px}.filters{flex-wrap:wrap}.search,.filters input[type=search]{width:100%}.connection{margin-left:0}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}

<body>
<section id="login" class="login" aria-label="管理员登录">
  <div class="login-hotspots">
    <label class="sr-only" for="loginToken">管理员令牌</label>
    <input id="loginToken" type="password" placeholder="请输入管理员令牌" autocomplete="current-password" aria-label="管理员令牌">
    <button class="eye" id="toggleToken" type="button" aria-label="显示或隐藏令牌">显示或隐藏令牌</button>
    <button class="login-submit" id="loginSubmit" type="button" aria-label="进入管理系统">进入管理系统</button>
    <div class="login-error" id="loginError" role="alert"></div>
  </div>
</section>
<section id="app" class="app hidden">
<header class="topbar"><div class="brand-mini"><img class="brand-logo" src="/assets/admin-brand.png" alt="硒游记"><i></i><span>智慧后台管理系统</span></div><div class="top-slogan">一城一山水 · 一硒一安康</div><div class="userbar"><button class="logout" id="logout">退出登录</button></div></header>
<main class="content"><div class="heading"><div><h1>商品管理</h1><p>管理硒游记前端展示的商品，共 <span id="totalLabel">0</span> 件</p></div><div class="heading-actions"><button class="primary" id="add">＋ 新增商品</button><button class="secondary" id="import">导入原有商品</button></div></div>
<div class="filters"><div class="search"><input id="search" type="search" placeholder="搜索商品名称"></div><select id="scene"><option value="">全部场景</option></select><span class="count">找到 <b id="count">0</b> 件商品</span><span class="connection">管理令牌已连接</span><button class="change" id="changeToken">更换</button></div>
<div class="table-box"><table><thead><tr><th>ID</th><th>图片</th><th>商品名称</th><th>价格</th><th>场景</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p class="hint">公开展示接口：<a href="/api/products" target="_blank">/api/products</a>。新增、编辑、上下架和批量导入需要管理员令牌。</p></main><footer class="page-footer">一城一山水 · 一硒一安康</footer></section>
<div class="modal" id="modal"><div class="dialog"><h2 id="formTitle">新增商品</h2><div class="form-grid"><label class="field">商品名称<input id="name" maxlength="240"></label><label class="field">价格（可留空）<input id="price" type="number" min="0" step="0.01"></label><label class="field">所属场景<select id="sceneId"></select></label><label class="field">销量快照<input id="sales" type="number" min="0" value="0"></label><label class="field wide">品牌官网商品链接<input id="url" type="url"></label><label class="field wide">商品介绍<textarea id="description"></textarea></label><label class="field wide">商品主图<input id="image" type="file" accept="image/jpeg,image/png,image/webp"><span class="file-hint" id="imageHint">支持 JPG/PNG/WebP，最大 8MB</span></label><label class="field wide"><span><input id="active" type="checkbox" checked> 上架展示</span></label></div><div class="footer"><button class="secondary" id="cancel">取消</button><button class="primary" id="save">保存商品</button></div></div></div>
<script>
const API='';let scenes=[],items=[],editing=null;const $=id=>document.getElementById(id);const token=()=>sessionStorage.getItem('adminToken')||'';
async function request(url,options={}){const r=await fetch(API+url,options);if(!r.ok){let x={};try{x=await r.json()}catch{}throw Error(x.detail||`HTTP ${r.status}`)}return r.json()}
function showLogin(message=''){ $('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginError').textContent=message;$('loginToken').value=''; }
async function enter(){const value=$('loginToken').value.trim();if(!value){$('loginError').textContent='请输入管理员令牌';return}sessionStorage.setItem('adminToken',value);try{await request('/api/admin/session',{headers:{'X-Admin-Token':value}});await init();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){sessionStorage.removeItem('adminToken');$('loginError').textContent='令牌验证失败或后端不可用，请重试'}}
async function init(){scenes=await request('/api/scenes');$('scene').innerHTML='<option value="">全部场景</option>';$('sceneId').innerHTML='';for(const s of scenes){$('scene').add(new Option(s.name,s.id));$('sceneId').add(new Option(s.name,s.id))}await load()}
async function load(){const p=new URLSearchParams();if($('scene').value)p.set('scene',$('scene').value);if($('search').value)p.set('q',$('search').value);items=(await request('/api/products?'+p)).items;$('count').textContent=items.length;$('totalLabel').textContent=items.length;render()}
function sceneClass(name){return /水|瀑布|泉/.test(name)?'scene-blue':/茶|田|村/.test(name)?'scene-mint':'scene-gray'}
function render(){$('rows').innerHTML=items.map(x=>`<tr><td>${x.id}</td><td>${x.image_url?`<img src="${x.image_url}" alt="">`:''}</td><td>${esc(x.name)}</td><td>${x.price==null?'询价':'¥'+Number(x.price).toFixed(2)}</td><td><span class="pill ${sceneClass(x.scene_name)}">${esc(x.scene_name)}</span></td><td><span class="pill ${x.is_active?'active':'inactive'}">${x.is_active?'已上架':'已下架'}</span></td><td><div class="actions"><button class="edit" data-edit="${x.id}">编辑</button><button class="toggle" data-toggle="${x.id}">${x.is_active?'下架':'上架'}</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无商品</td></tr>'}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(x=null){editing=x;$('formTitle').textContent=x?`编辑商品 #${x.id}`:'新增商品';$('name').value=x?.name||'';$('price').value=x?.price??'';$('sales').value=x?.sales??0;$('sceneId').value=x?.scene_id||scenes[0]?.id||'';$('url').value=x?.official_url||'';$('description').value=x?.description||'';$('active').checked=x?.is_active??true;$('image').value='';$('imageHint').textContent=x?.image_url||'支持 JPG/PNG/WebP，最大 8MB';$('modal').classList.add('open')}
async function save(){const body={name:$('name').value.trim(),price:$('price').value===''?null:Number($('price').value),sales:Number($('sales').value||0),scene_id:$('sceneId').value,official_url:$('url').value.trim(),description:$('description').value,image_path:editing?.image_url||'',is_active:$('active').checked};try{const headers={'Content-Type':'application/json','X-Admin-Token':token()};const x=editing?await request('/api/admin/products/'+editing.id,{method:'PATCH',headers,body:JSON.stringify(body)}):await request('/api/admin/products',{method:'POST',headers,body:JSON.stringify(body)});const f=$('image').files[0];if(f){const fd=new FormData();fd.append('image',f);await request('/api/admin/products/'+x.id+'/image',{method:'POST',headers:{'X-Admin-Token':token()},body:fd})}$('modal').classList.remove('open');await load()}catch(e){alert(e.message)}}
$('loginSubmit').onclick=enter;$('loginToken').onkeydown=e=>{if(e.key==='Enter')enter()};$('toggleToken').onclick=()=>{$('loginToken').type=$('loginToken').type==='password'?'text':'password'};$('logout').onclick=()=>{sessionStorage.removeItem('adminToken');showLogin()};$('changeToken').onclick=()=>{sessionStorage.removeItem('adminToken');showLogin()};$('add').onclick=()=>openForm();$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=save;$('search').oninput=()=>load();$('scene').onchange=()=>load();$('rows').onclick=async e=>{const id=Number(e.target.dataset.edit||e.target.dataset.toggle);if(!id)return;const x=items.find(y=>y.id===id);if(e.target.dataset.edit)openForm(x);else{try{await request('/api/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':token()},body:JSON.stringify({...x,is_active:!x.is_active})});await load()}catch(e){alert(e.message)}}};$('import').onclick=async()=>{if(!confirm('把源码内现有 72 件商品导入 PostgreSQL？已有相同 ID 不会覆盖。'))return;try{const r=await request('/api/admin/import-seed',{method:'POST',headers:{'X-Admin-Token':token()}});alert(`已处理 ${r.imported_or_existing} 件商品`);await load()}catch(e){alert(e.message)}};showLogin();

</script>
</body></html>
