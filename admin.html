<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>硒游记商品管理</title>
<style>
:root{font-family:"Microsoft YaHei",sans-serif;color:#20362f;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{height:58px;background:#244f41;color:white;display:flex;align-items:center;padding:0 24px;font-size:18px;font-weight:700}main{max-width:1180px;margin:24px auto;padding:0 18px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}button{border:0;background:#285b49;color:#fff;padding:9px 14px;border-radius:5px;cursor:pointer}button.secondary{background:#74867f}input,select,textarea{font:inherit;border:1px solid #d2dbd6;border-radius:4px;padding:8px;background:#fff}input[type=search]{width:260px}.table-wrap{overflow:auto;background:white;border:1px solid #dfe7e2}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf1ee;vertical-align:middle}th{background:#edf3ef;white-space:nowrap}td img{width:54px;height:54px;object-fit:cover}.actions{display:flex;gap:6px}.actions button{padding:6px 9px;font-size:12px}.status{color:#537465}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(620px,100%);max-height:95vh;overflow:auto;background:#fff;padding:20px;border-radius:6px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}textarea{min-height:90px}.footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.hint{font-size:12px;color:#718178}.empty{padding:36px;text-align:center;color:#718178}a{color:#285b49}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.toolbar{flex-wrap:wrap}input[type=search]{width:100%}}
</style>
</head>
<body><header>硒游记 · 商品管理</header><main>
<div class="toolbar"><button id="add">新增商品</button><button class="secondary" id="import">导入原有 72 件商品</button><input id="token" type="password" placeholder="管理员令牌（本机 .env 的 ADMIN_TOKEN）"><input id="search" type="search" placeholder="搜索商品名称"><select id="scene"><option value="">全部场景</option></select><span id="status" class="status"></span></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>图片</th><th>商品名称</th><th>价格</th><th>场景</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="hint">公开展示接口：<a href="/api/products" target="_blank">/api/products</a>。新增/编辑和批量导入需要管理员令牌。</p></main>
<div class="modal" id="modal"><div class="dialog"><h2 id="formTitle">新增商品</h2><div class="form-grid">
<label class="field">商品名称<input id="name" maxlength="240"></label><label class="field">价格（可留空）<input id="price" type="number" min="0" step="0.01"></label>
<label class="field">所属场景<select id="sceneId"></select></label><label class="field">销量快照<input id="sales" type="number" min="0" value="0"></label>
<label class="field wide">品牌官网商品链接<input id="url" type="url"></label><label class="field wide">商品介绍<textarea id="description"></textarea></label>
<label class="field wide">商品主图<input id="image" type="file" accept="image/jpeg,image/png,image/webp"><span class="hint" id="imageHint">支持 JPG/PNG/WebP，最大 8MB</span></label>
<label class="field wide"><span><input id="active" type="checkbox" checked> 上架展示</span></label>
</div><div class="footer"><button class="secondary" id="cancel">取消</button><button id="save">保存商品</button></div></div></div>
<script>
const API='';let scenes=[],items=[],editing=null;
const $=id=>document.getElementById(id);const token=()=> $('token').value;
async function request(url,options={}){const r=await fetch(API+url,options);if(!r.ok){let x={};try{x=await r.json()}catch{}throw Error(x.detail||`HTTP ${r.status}`)}return r.json()}
async function init(){try{scenes=await request('/api/scenes');for(const s of scenes){$('scene').add(new Option(s.name,s.id));$('sceneId').add(new Option(s.name,s.id))}await load()}catch(e){$('status').textContent=e.message}}
async function load(){const p=new URLSearchParams();if($('scene').value)p.set('scene',$('scene').value);if($('search').value)p.set('q',$('search').value);try{items=(await request('/api/products?'+p)).items;render();$('status').textContent=`${items.length} 件商品`}catch(e){$('status').textContent=e.message;$('rows').innerHTML='<tr><td colspan="7" class="empty">数据库未连接或尚未导入商品，请配置 PostgreSQL。</td></tr>'}}
function render(){$('rows').innerHTML=items.map(x=>`<tr><td>${x.id}</td><td>${x.image_url?`<img src="${x.image_url}" alt="">`:''}</td><td>${esc(x.name)}</td><td>${x.price==null?'询价':'¥'+Number(x.price).toFixed(2)}</td><td>${esc(x.scene_name)}</td><td>${x.is_active?'上架':'下架'}</td><td><div class="actions"><button data-edit="${x.id}">编辑</button><button class="secondary" data-toggle="${x.id}">${x.is_active?'下架':'上架'}</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无商品</td></tr>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(x=null){editing=x;$('formTitle').textContent=x?`编辑商品 #${x.id}`:'新增商品';$('name').value=x?.name||'';$('price').value=x?.price??'';$('sales').value=x?.sales??0;$('sceneId').value=x?.scene_id||scenes[0]?.id||'';$('url').value=x?.official_url||'';$('description').value=x?.description||'';$('active').checked=x?.is_active??true;$('image').value='';$('imageHint').textContent=x?.image_url||'支持 JPG/PNG/WebP，最大 8MB';$('modal').classList.add('open')}
async function save(){const body={name:$('name').value.trim(),price:$('price').value===''?null:Number($('price').value),sales:Number($('sales').value||0),scene_id:$('sceneId').value,official_url:$('url').value.trim(),description:$('description').value,image_path:editing?.image_url||'',is_active:$('active').checked};try{const headers={'Content-Type':'application/json','X-Admin-Token':token()};const x=editing?await request('/api/admin/products/'+editing.id,{method:'PATCH',headers,body:JSON.stringify(body)}):await request('/api/admin/products',{method:'POST',headers,body:JSON.stringify(body)});const f=$('image').files[0];if(f){const fd=new FormData();fd.append('image',f);await request('/api/admin/products/'+x.id+'/image',{method:'POST',headers:{'X-Admin-Token':token()},body:fd})}$('modal').classList.remove('open');await load()}catch(e){alert(e.message)}}
$('add').onclick=()=>openForm();$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=save;$('search').oninput=()=>load();$('scene').onchange=()=>load();$('rows').onclick=async e=>{const id=Number(e.target.dataset.edit||e.target.dataset.toggle);if(!id)return;const x=items.find(y=>y.id===id);if(e.target.dataset.edit)openForm(x);else{try{await request('/api/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':token()},body:JSON.stringify({...x,is_active:!x.is_active})});await load()}catch(e){alert(e.message)}}};$('import').onclick=async()=>{if(!confirm('把源码内现有 72 件商品导入 PostgreSQL？已有相同 ID 不会覆盖。'))return;try{const r=await request('/api/admin/import-seed',{method:'POST',headers:{'X-Admin-Token':token()}});alert(`已处理 ${r.imported_or_existing} 件商品`);await load()}catch(e){alert(e.message)}};init();
</script></body></html>
