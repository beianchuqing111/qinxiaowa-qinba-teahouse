<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF2F0">
<title>硒游记 · 秦巴取硒之旅</title>
<style>
:root{
  --cream:#F7F0E5; --brown:#4A3325; --wood:#6B4A2F;
  --g700:#3A5C4D; --g600:#4C7362; --cyan:#2A9D96;
  --ink:#1B3029; --muted:#7A9089; --line:#E1EAE6;
  --card:#FFFFFF; --soft:#F5F9F7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cream); color:var(--ink); line-height:1.7;
  display:flex; justify-content:center; min-height:100vh;
}
.app{width:100%;max-width:430px;background:var(--cream);position:relative;overflow:hidden}
@media(min-width:520px){.app{box-shadow:0 0 0 1px rgba(74,51,37,.08),0 24px 70px rgba(74,51,37,.18)}}

/* ---- 顶部 ---- */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:12px 18px;background:rgba(247,240,229,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(107,74,47,.14);
}
.topbar .logo{font-size:17px;font-weight:800;color:var(--brown);letter-spacing:.14em}
.topbar .sub{font-size:10.5px;color:#9A8267;letter-spacing:.06em;margin-top:1px}

/* ---- 地图 ---- */
.mapwrap{position:relative;width:100%;line-height:0}
.mapwrap img.map{width:100%;display:block}
.mapwrap::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(74,51,37,.16) 100%);
}

/* ---- 牌匾 ---- */
.slot{
  position:absolute;transform:translate(-50%,-50%);
  z-index:10;
}
.plaque{
  display:block;width:100%;padding:0;border:none;background:none;cursor:pointer;
  filter:drop-shadow(0 6px 10px rgba(74,51,37,.34));
  animation:floaty 3.6s ease-in-out infinite; animation-delay:var(--d,0s);
  transition:filter .25s;
}
.plaque img{width:100%;display:block}
.plaque:active{filter:drop-shadow(0 2px 5px rgba(74,51,37,.5)) brightness(.94)}
.slot{width:12%;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:var(--d,0s)}
@keyframes floaty{
  0%,100%{transform:translateY(0) rotate(-1.1deg)}
  50%    {transform:translateY(-9px) rotate(1.1deg)}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* ---- 视图切换：地图页常驻（永不隐藏，动画不重播），商品页滑入覆盖 ---- */
#vMap{display:block}
#vGoods{
  position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:430px;
  transform:translateX(-50%) translateX(103%);
  background:var(--cream);z-index:100;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transition:transform .3s cubic-bezier(.25,.8,.3,1);
  visibility:hidden;
}
#vGoods.on{transform:translateX(-50%);visibility:visible}
body.lock{overflow:hidden}
.gbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(247,240,229,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(107,74,47,.14);
}
.back{
  width:36px;height:36px;flex:none;border-radius:11px;border:1px solid rgba(107,74,47,.2);
  background:#fff;color:var(--wood);font-size:17px;line-height:1;display:grid;place-items:center;
  cursor:pointer;font-family:inherit;
}
.back:active{background:#F1E8DA}
.gbar .gt{font-size:16px;font-weight:800;color:var(--brown);letter-spacing:.04em}
.gbar .gs{font-size:10.5px;color:#9A8267;margin-top:1px}

.gwrap{padding:16px 16px 90px}
.sintro{
  margin:2px 2px 12px;padding:11px 15px;
  font-size:13px;line-height:1.85;color:#5A4A38;
  background:rgba(255,253,247,.92);
  border-left:3px solid var(--g600);
  border-radius:0 10px 10px 0;
}

.gcount{font-size:11.5px;color:#9A8267;margin:0 2px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(107,74,47,.1);
  box-shadow:0 2px 10px rgba(74,51,37,.07);display:flex;flex-direction:column}
.gcard .ph{width:100%;aspect-ratio:1/1;background:#FAFAF8;overflow:hidden}
.gcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .bd{padding:10px 11px 12px;flex:1;display:flex;flex-direction:column}
.gcard .nm{font-size:12.5px;line-height:1.45;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.gcard .mt{display:flex;align-items:baseline;justify-content:space-between;margin-top:7px}
.gcard .pr{font-size:15px;font-weight:800;color:var(--brown)}
.gcard .sl{font-size:10px;color:var(--muted)}
.gcard .buy{
  margin-top:9px;width:100%;padding:8px;border:none;border-radius:9px;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--g600),var(--cyan));
}
.gcard .buy:active{opacity:.88}

.note{text-align:center;font-size:10.5px;color:#9A8267;line-height:1.9;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}


/* ============ 欢迎页（数字人开场，移植自团队 React 版） ============ */
:root{
  --w-paper:#f7f2e6; --w-paper-soft:#fffdf7;
  --w-ink:#1f302a; --w-ink-soft:#4b5c53; --w-ink-mute:#7f8d85;
  --w-line:rgba(31,48,42,.14);
  --w-gold:#c9a45c; --w-gold-deep:#a2783a;
  --w-font-title:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
}
#vWelcome{
  position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:430px;
  transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;overflow:hidden;
  background-image:linear-gradient(180deg,
      rgba(247,242,230,.90) 0%, rgba(247,242,230,.46) 24%,
      rgba(247,242,230,.26) 52%, rgba(247,242,230,.62) 78%,
      rgba(247,242,230,.95) 100%),
    url('assets/map.jpg');
  background-size:cover,cover;
  background-position:center center,center 34%;
  background-repeat:no-repeat,no-repeat;
  transition:opacity .55s ease, transform .55s ease;
}
#vWelcome.off{opacity:0;transform:translateX(-50%) translateY(-4%);pointer-events:none}
#vWelcome.off .dh-wrap{opacity:0;transition:opacity .16s linear}

.w-header{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 0;text-align:center}
.w-brandPlate{
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 22px 10px;color:#4a3413;
  background:linear-gradient(180deg,#fdf1d4 0%,var(--w-gold) 100%);
  border:1px solid var(--w-gold-deep);border-radius:12px;
  box-shadow:0 6px 18px rgba(120,82,24,.30);
}
.w-brandName{margin:0;font-family:var(--w-font-title);font-size:27px;font-weight:700;letter-spacing:.3em;text-indent:.3em}
.w-brandSub{font-size:11px;letter-spacing:.4em;text-indent:.4em;opacity:.8}

/* 卷轴式对白框：上下木轴 + 纸面 + 两侧卷边线 */
.w-dialogue{
  position:relative;z-index:2;margin:24px 20px 0;padding:15px 20px;
  display:flex;flex-direction:column;gap:6px;
  background-color:#FCF7EC;
  background-image:
    linear-gradient(90deg, rgba(160,132,90,.28) 0 1.5px, transparent 1.5px),
    linear-gradient(270deg, rgba(160,132,90,.28) 0 1.5px, transparent 1.5px),
    linear-gradient(180deg,#FFFCF4 0%,#FAF3E4 100%);
  background-size:1.5px 100%, 1.5px 100%, 100% 100%;
  background-position:13px 0, calc(100% - 13px) 0, 0 0;
  background-repeat:no-repeat;
  box-shadow:0 8px 22px rgba(74,51,37,.13);
}
.w-dialogue::before,.w-dialogue::after{
  content:'';position:absolute;left:-9px;right:-9px;height:10px;border-radius:5px;
  background:linear-gradient(180deg,#9C7550 0%,#6B4A2F 100%);
  box-shadow:0 2px 7px rgba(74,51,37,.30);
}
.w-dialogue::before{top:-6px}
.w-dialogue::after{bottom:-6px}
.w-line{margin:0;font-size:15px;line-height:1.7;color:var(--w-ink);opacity:0;transform:translateY(6px);animation:wFadeUp .5s ease forwards}
.w-lineTwo{animation-delay:.75s;color:var(--w-ink-soft)}
@keyframes wFadeUp{to{opacity:1;transform:translateY(0)}}

.w-stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding:6px 0 0;animation:wRiseIn .9s ease-out both}
.w-actions{position:relative;z-index:3;padding:8px 24px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center}
.w-continue{
  display:block;width:100%;padding:14px 0;
  font-family:var(--w-font-title);font-size:18px;letter-spacing:.32em;text-indent:.32em;color:#4a3413;
  background:linear-gradient(180deg,#fdf1d4 0%,var(--w-gold) 100%);
  border:1px solid var(--w-gold-deep);border-radius:999px;
  box-shadow:0 8px 20px rgba(120,82,24,.32);
  transition:transform .16s ease,box-shadow .16s ease;
}
.w-continue:active{transform:translateY(1px) scale(.99);box-shadow:0 4px 12px rgba(120,82,24,.28)}
.w-footnote{margin:10px 0 0;font-size:11px;line-height:1.6;color:var(--w-ink-soft);text-shadow:0 1px 0 rgba(255,253,247,.85)}

/* 数字人舞台 */
.dh-wrap{position:relative;display:flex;flex-direction:column;align-items:center;pointer-events:none;height:100%;width:100%;max-width:340px;animation:dhFloat 4.2s ease-in-out .9s infinite;will-change:transform}
.dh-figureBox{width:100%;display:flex;justify-content:center;align-items:flex-end;flex:1;min-height:0}
.dh-figure{width:100%;height:auto;display:block;object-fit:contain;user-select:none;filter:drop-shadow(0 10px 18px rgba(31,48,42,.22))}
.dh-figureVideo{width:auto;height:100%;max-width:100%;object-fit:contain;filter:none;pointer-events:none}
.dh-nameTag{
  margin-top:-6px;padding:3px 12px;font-family:var(--w-font-title);font-size:12px;letter-spacing:.18em;
  color:var(--w-paper-soft);background:linear-gradient(180deg,var(--w-gold) 0%,var(--w-gold-deep) 100%);
  border-radius:999px;box-shadow:0 2px 8px rgba(31,48,42,.12);
}
@keyframes wRiseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
/* 数字人持续上下悬浮：视频播完后不会"钉"在最后一帧，整个人（含名牌）像浮在水面上呼吸 */
@keyframes dhFloat{
  0%,100%{transform:translateY(0)}
  50%    {transform:translateY(-9px)}
}

/* ============ 地图页底部常驻位：缩小后的秦小娲 + 卷轴对白 ============ */
.dhDock{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  max-width:430px;margin:0 auto;
  padding:0 14px env(safe-area-inset-bottom,0px);
  display:flex;align-items:flex-end;gap:10px;
  pointer-events:none;
  opacity:0;transition:opacity .45s ease .3s;
}
#vMap.ready .dhDock{opacity:1}
.dhDock-figure{flex:none;height:142px;width:auto;margin-bottom:-8px;transform-origin:center bottom;
  animation:dhFloat 4.6s ease-in-out .35s infinite;will-change:transform}
.dhDock-figure video{height:100%;width:auto;display:block;
  filter:drop-shadow(0 6px 13px rgba(31,48,42,.30));pointer-events:none}
.dhDock-bubble{
  position:relative;margin-bottom:44px;max-width:272px;
  padding:10px 15px;font-size:13px;line-height:1.7;color:var(--w-ink);
  background-color:#FCF7EC;
  background-image:linear-gradient(180deg,#FFFCF4 0%,#FAF3E4 100%);
  border-left:1px solid #E8DCC6;border-right:1px solid #E8DCC6;
  box-shadow:0 4px 14px rgba(74,51,37,.18);
  opacity:0;transform:translateY(6px);transition:opacity .4s ease .6s, transform .4s ease .6s;
}
#vMap.ready .dhDock-bubble{opacity:1;transform:none}
.dhDock-hint{display:block;margin-top:4px;font-size:11.5px;color:#8A7A66;letter-spacing:.02em}
.dhDock-bubble::before,.dhDock-bubble::after{
  content:'';position:absolute;left:-5px;right:-5px;height:6px;border-radius:3px;
  background:linear-gradient(180deg,#9C7550 0%,#6B4A2F 100%);
}
.dhDock-bubble::before{top:-3px}
.dhDock-bubble::after{bottom:-3px}

/* 牌匾进场动画：等欢迎页收起后再播 */
.slot{animation-play-state:paused}
#vMap.ready .slot{animation-play-state:running}

/* ============ 秦小娲对话面板 ============ */
.chatPanel{
  position:fixed;left:50%;bottom:0;width:100%;max-width:430px;
  transform:translateX(-50%) translateY(106%);
  z-index:150;height:68vh;max-height:600px;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FFFCF4,#FAF3E4);
  border-top:9px solid #6B4A2F;
  border-radius:18px 18px 0 0;
  box-shadow:0 -12px 40px rgba(31,48,42,.30);
  transition:transform .4s cubic-bezier(.2,.85,.3,1);
  visibility:hidden;
}
.chatPanel.on{transform:translateX(-50%);visibility:visible}
.chatHead{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid #E8DCC6}
.chatAv{position:relative;width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden;
  border:2px solid var(--w-gold);background:#fff;transition:box-shadow .25s}
.chatAv.thinking{box-shadow:0 0 0 3px rgba(42,157,150,.35)}
.chatAv img,.chatAv video{width:100%;height:100%;object-fit:cover;object-position:50% 0%;display:none}
.chatAv img.on,.chatAv video.on{display:block}
.chatHead .ct{font-size:14.5px;font-weight:800;color:#4A3325}
.chatHead .cs{font-size:10.5px;color:#8A7A66;margin-top:1px}
.chatClose{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid rgba(107,74,47,.25);
  background:#fff;color:#6B4A2F;font-size:14px;line-height:1;display:grid;place-items:center;cursor:pointer}
.chatMsgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:9px 12px;font-size:13px;line-height:1.7;border-radius:12px;
  white-space:pre-wrap;word-break:break-word}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid #E8DCC6;color:var(--w-ink);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--g600),var(--cyan));color:#fff;border-bottom-right-radius:4px}
.msg.typing{color:#8A7A66;animation:think 1.3s ease-in-out infinite}
@keyframes think{0%,100%{opacity:.45}50%{opacity:1}}
.chatChips{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex:none}
.chatChips button{flex:none;padding:6px 11px;font-size:11.5px;color:#4A5C50;
  background:#fff;border:1px solid #D8E4DD;border-radius:999px;cursor:pointer;font-family:inherit}
.chatChips button:active{background:#EEF5F1}
.chatInput{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));flex:none}
.chatInput input{flex:1;padding:10px 13px;font-size:13px;font-family:inherit;color:var(--w-ink);
  background:#fff;border:1px solid #E0D6C4;border-radius:11px;outline:none}
.chatInput input:focus{border-color:var(--w-gold)}
.chatInput button{flex:none;width:48px;border:none;border-radius:11px;cursor:pointer;color:#fff;
  font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--g600),var(--cyan));font-family:inherit}
.chatInput button:disabled{opacity:.5}
/* 让左下角立绘可点 */
.dhDock-figure{pointer-events:auto;cursor:pointer}
.recCard{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);
  align-self:flex-start;padding:7px;background:#fff;border:1px solid #E8DCC6;border-radius:12px;
  cursor:pointer;box-shadow:0 2px 8px rgba(74,51,37,.08)}
.recCard img{width:54px;height:54px;border-radius:9px;object-fit:cover;flex:none;background:#FAFAF8}
.recCard .rc-bd{flex:1;min-width:0}
.recCard .rc-nm{font-size:12px;line-height:1.45;color:var(--w-ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recCard .rc-pr{font-size:13px;font-weight:800;color:var(--brown);margin-top:2px}
.recCard .rc-go{flex:none;font-size:11px;font-weight:700;color:var(--g600);white-space:nowrap}
.recCard:active{background:#F7F4EC}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 欢迎页（扫码后第一屏 · 数字人开场） ============ -->
  <section id="vWelcome">
    <header class="w-header">
      <div class="w-brandPlate">
        <h1 class="w-brandName">硒游记</h1>
        <span class="w-brandSub">秦巴山水集</span>
      </div>
    </header>

    <section class="w-dialogue" aria-label="秦小娲的开场白">
      <p class="w-line">我是秦小娲。一座山挡风，一条江送水。</p>
      <p class="w-line w-lineTwo">安康的土就这样养出了硒。跟我去看看“硒游记”</p>
    </section>

    <div class="w-stage">
      <div class="dh-wrap">
        <div class="dh-figureBox">
          <video id="dhVideo" class="dh-figure dh-figureVideo"
                 src="assets/digitalHuman/qinxiaowa-welcome.webm"
                 poster="assets/digitalHuman/qinxiaowa-welcome-poster.png"
                 autoplay muted playsinline preload="auto" disablepictureinpicture
                 aria-label="数字人秦小娲"></video>
        </div>
        <span class="dh-nameTag">秦小娲</span>
      </div>
    </div>

    <div class="w-actions">
      <button type="button" class="w-continue" id="btnContinue">继续</button>
      <p class="w-footnote">
        本页为品牌官网之前的内容与导购入口，不承接支付与订单，购买请前往品牌官网。<br>
        商品资料与价格以品牌官网公示为准。
      </p>
    </div>
  </section>

  <!-- ============ 地图页 ============ -->
  <section id="vMap">
    <div class="topbar">
      <div>
        <div class="logo">硒游记</div>
        <div class="sub">秦巴取硒 · 六铺寻味</div>
      </div>
    </div>
    <div class="mapwrap" id="mapwrap">
      <img class="map" src="assets/map.jpg" alt="秦巴取硒地图">
      <div class="slot" style="left:36%;top:10%;--d:0.00s">
        <button class="plaque" data-scene="xian" aria-label="西安">
          <img src="assets/plaques/01.png" alt="西安">
        </button>
      </div>
      <div class="slot" style="left:89%;top:26%;--d:0.42s">
        <button class="plaque" data-scene="spring" aria-label="山泉瀑布">
          <img src="assets/plaques/02.png" alt="山泉瀑布">
        </button>
      </div>
      <div class="slot" style="left:11%;top:34%;--d:0.84s">
        <button class="plaque" data-scene="tea" aria-label="云雾茶园">
          <img src="assets/plaques/03.png" alt="云雾茶园">
        </button>
      </div>
      <div class="slot" style="left:88%;top:38%;--d:1.26s">
        <button class="plaque" data-scene="field" aria-label="林下魔芋田">
          <img src="assets/plaques/04.png" alt="林下魔芋田">
        </button>
      </div>
      <div class="slot" style="left:11%;top:61%;--d:1.68s">
        <button class="plaque" data-scene="kitchen" aria-label="村舍炊烟">
          <img src="assets/plaques/05.png" alt="村舍炊烟">
        </button>
      </div>
      <div class="slot" style="left:89%;top:68%;--d:2.10s">
        <button class="plaque" data-scene="store" aria-label="街边杂货铺">
          <img src="assets/plaques/06.png" alt="街边杂货铺">
        </button>
      </div>
      <div class="slot" style="left:26%;top:86%;--d:2.52s">
        <button class="plaque" data-scene="post" aria-label="江边驿站">
          <img src="assets/plaques/07.png" alt="江边驿站">
        </button>
      </div>
    </div>

    <!-- 底部常驻位：缩小后的秦小娲 + 卷轴对白（点「继续」后飞到这里） -->
    <div class="dhDock" id="dhDock">

/* ---------- 欢迎页：数字人开场 + 音频解锁降级链 ---------- */
(function(){
  var el = document.getElementById('dhVideo');
  if(!el) return;
  var disposed = false;

  function detach(){
    window.removeEventListener('pointerdown', unlock);
    window.removeEventListener('touchstart', unlock);
    window.removeEventListener('keydown', unlock);
    document.removeEventListener('WeixinJSBridgeReady', playWithSound, false);
  }
  /* 带声音播放；成功就撤掉兜底（开场只演一遍），失败则静音保画面 */
  function playWithSound(){
    if(disposed) return;
    el.muted = false;
    var p = el.play();
    if(p && p.then){
      p.then(detach).catch(function(){
        el.muted = true;
        var q = el.play(); if(q && q.catch) q.catch(function(){});
      });
    }
  }
  /* 真·兜底：用户第一次交互时开声，并把开场白从头念一遍（已播完则不重放） */
  function unlock(){
    if(el.ended){ detach(); return; }
    el.muted = false;
    try{ el.currentTime = 0; }catch(e){}
    var p = el.play(); if(p && p.catch) p.catch(function(){});
    detach();
  }

  el.addEventListener('ended', detach);
  document.addEventListener('WeixinJSBridgeReady', playWithSound, false);  /* ① 微信内直接有声 */
  playWithSound();                                                        /* ② 立即尝试有声 */
  window.addEventListener('pointerdown', unlock);                         /* ④ 首次交互兜底 */
  window.addEventListener('touchstart', unlock);
  window.addEventListener('keydown', unlock);

  window.__dhDispose = function(){ disposed = true; detach(); };
})();

/* 「继续」→ 收起欢迎页；秦小娲缩小飞向地图页底部常驻位，对白框留在屏幕上
   ------------------------------------------------------------
   用 FLIP：先把底部的小秦小娲「放大并平移」到大秦小娲所在的位置，
   再过渡回原位 —— 视觉上就是她一边缩小一边落到左下角。
   ------------------------------------------------------------ */
document.getElementById('btnContinue').addEventListener('click', function(){
  var bigWrap = document.querySelector('.w-stage .dh-wrap');
  var r1 = bigWrap ? bigWrap.getBoundingClientRect() : null;

  var bigV = document.getElementById('dhVideo');
  if(bigV) bigV.pause();                       /* 大图停播，只留底部那位在动 */

  document.getElementById('vWelcome').classList.add('off');
  document.body.classList.remove('lock');
  document.getElementById('vMap').classList.add('ready');

  var small = document.getElementById('dhDockFigure');
  if(!r1 || !small) return;

  small.style.animation = 'none';               /* 先停浮动，避免与 FLIP 的 transform 打架 */
  void small.offsetWidth;                       /* 强制回流，保证下面量到的是干净位置 */
  var r2 = small.getBoundingClientRect();
  if(!r2.height) return;

  var sc = r1.height / r2.height;
  var dx = (r1.left + r1.width / 2) - (r2.left + r2.width / 2);
  var dy = (r1.top + r1.height / 2) - (r2.top + r2.height / 2);

  small.style.transition = 'none';
  small.style.transformOrigin = 'center center';
  small.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ')';

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      small.style.transition = 'transform .9s cubic-bezier(.34,.85,.25,1)';
      small.style.transform = 'none';
      setTimeout(function(){
        small.style.transition = '';
        small.style.transformOrigin = '';
        small.style.animation = '';             /* 恢复上下浮动 */
      }, 930);
    });
  });
});

document.getElementById('chatChips').innerHTML = CHIPS.map(c=>'<button data-q="'+c+'">'+c+'</button>').join('');

function chatOpen(){
  document.getElementById('chatPanel').classList.add('on');
  if(!chatHist.length){
    const hi='你好呀，我是秦小娲。安康的好东西我都在行——想送人、想自己吃，或者随便听听，都可以问我。';
    addMsg('ai',hi); chatHist.push({role:'assistant',content:hi});
  }
  setTimeout(function(){ elIn.focus(); },400);
}
function chatClose(){ document.getElementById('chatPanel').classList.remove('on'); }

/* 思考态：头像切挠头视频循环，结束切回静态图 */
function setThink(on){
  var i=document.getElementById('cavImg'), v=document.getElementById('cavVid');
  document.getElementById('chatAv').classList.toggle('thinking',on);
  if(on){ i.classList.remove('on'); v.classList.add('on');
    try{ v.currentTime=0; var pp=v.play(); if(pp&&pp.catch)pp.catch(function(){}); }catch(e){} }
  else{ v.classList.remove('on'); i.classList.add('on'); try{ v.pause(); }catch(e){} }
}

function addMsg(role,text,cls){
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'me':'ai')+(cls?' '+cls:'');
  d.textContent=text;
  elMsgs.appendChild(d); elMsgs.scrollTop=elMsgs.scrollHeight;
  return d;
}

async function send(text){
  text=(text||'').trim();
  if(chatBusy||!text) return;
  chatBusy=true; elSend.disabled=true; setThink(true);
  elIn.value='';
  addMsg('user',text);
  chatHist.push({role:'user',content:text});
  const t=addMsg('ai','正在思考中，容我想想一想…','typing');
  let acc='';
  try{
    const res=await fetch(AI.url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI.key},
      body:JSON.stringify({model:AI.model,stream:true,temperature:.85,max_tokens:1100,
        messages:[{role:'system',content:AI_SYS}].concat(chatHist.slice(-12))})});
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const r=await reader.read(); if(r.done) break;
      buf+=dec.decode(r.value,{stream:true});
      const ls=buf.split('\n'); buf=ls.pop();
      for(const l of ls){
        if(l.indexOf('data:')!==0) continue;
        const dd=l.slice(5).trim(); if(dd==='[DONE]') continue;
        try{
          const j=JSON.parse(dd);
          const d=j.choices&&j.choices[0]&&j.choices[0].delta;
          if(d&&d.content){ acc+=d.content;
            t.textContent=acc.replace(/\[\[商品:\d+\]\]/g,'').replace(/\n{3,}/g,'\n\n')||'…';
            t.classList.remove('typing');
            elMsgs.scrollTop=elMsgs.scrollHeight; }
        }catch(e){}
      }
    }
    if(!acc) t.textContent='哎呀，我这会儿有点卡，你再问一次？';
  }catch(e){
    t.textContent='网络好像不太顺…你等一下再问我。';
  }
  t.classList.remove('typing');
  if(acc){
    var ids=[];
    try{ var mm=acc.match(/\[\[商品:(\d+)\]\]/g)||[];
      mm.forEach(function(x){ var n=parseInt(x.replace(/\D/g,''),10);
        if(ids.indexOf(n)<0) ids.push(n); }); }catch(e){}
    var clean=acc.replace(/\[\[商品:\d+\]\]/g,'').replace(/\n{3,}/g,'\n\n').trim();
    t.textContent=clean||'给你挑了几样：';
    var anchor=t;
    ids.slice(0,3).forEach(function(n){
      var g=null; for(var k=0;k<GOODS.length;k++){ if(GOODS[k].i===n){ g=GOODS[k]; break; } }
      if(!g) return;
      var c=document.createElement('div'); c.className='recCard';
      c.innerHTML='<img src="assets/goods/'+String(g.i).padStart(2,'0')+'.jpg" alt="">'
        +'<div class="rc-bd"><div class="rc-nm">'+g.n+'</div>'
        +'<div class="rc-pr">¥'+g.p+'</div></div>'
        +'<span class="rc-go">去购买 ›</span>';
      c.addEventListener('click',function(){ window.open(g.u,'_blank'); });
      anchor.insertAdjacentElement('afterend',c); anchor=c;
    });
    elMsgs.scrollTop=elMsgs.scrollHeight;
    chatHist.push({role:'assistant',content:acc});
  }
  setThink(false);
  chatBusy=false; elSend.disabled=false; elIn.value='';
}

elSend.addEventListener('click',function(){ send(elIn.value); });
elIn.addEventListener('keydown',function(e){ if(e.key==='Enter') send(elIn.value); });
document.getElementById('chatChips').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(b) send(b.getAttribute('data-q'));
});
document.getElementById('chatClose').addEventListener('click',chatClose);
document.getElementById('dhDockFigure').addEventListener('click',chatOpen);
</script>
</body>
</html>
