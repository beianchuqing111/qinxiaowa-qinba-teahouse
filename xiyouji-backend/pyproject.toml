[project]
name = "xiyouji-backend"
version = "0.1.0"
description = "硒游记 FastAPI backend with hybrid knowledge retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
